<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Warm abstract macOS desktop wallpaper</title>
  <desc id="desc">Layered amber, coral, indigo, and blue shapes inspired by classic Mac desktop wallpapers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203563"/>
      <stop offset=".42" stop-color="#6b4b78"/>
      <stop offset=".72" stop-color="#df7960"/>
      <stop offset="1" stop-color="#f2b56b"/>
    </linearGradient>
    <linearGradient id="ridgeA" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#efb471"/>
      <stop offset=".55" stop-color="#d35e55"/>
      <stop offset="1" stop-color="#793f64"/>
    </linearGradient>
    <linearGradient id="ridgeB" x1="0" y1="0" x2="1" y2=".4">
      <stop stop-color="#182b56"/>
      <stop offset=".55" stop-color="#355f83"/>
      <stop offset="1" stop-color="#7996a4"/>
    </linearGradient>
    <linearGradient id="ridgeC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15233f"/>
      <stop offset="1" stop-color="#263c59"/>
    </linearGradient>
    <radialGradient id="sun" cx="68%" cy="20%" r="44%">
      <stop stop-color="#ffe0a0" stop-opacity=".88"/>
      <stop offset=".45" stop-color="#ffc384" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffb779" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <path d="M-120 760C180 645 306 295 595 290c238-4 326 259 546 270 183 9 293-117 579-215v620H-120Z" fill="url(#ridgeA)"/>
  <path d="M-110 845C180 722 405 467 682 504c215 29 298 245 521 202 159-31 250-151 497-183v420H-110Z" fill="url(#ridgeB)"/>
  <path d="M-80 910c316-177 550-206 802-111 222 84 379 51 546-28 134-63 267-89 432-78v250H-80Z" fill="url(#ridgeC)"/>
  <path d="M0 614c326-49 517-307 758-254 185 41 279 231 506 182 118-26 212-105 336-146" fill="none" stroke="#fff2d1" stroke-opacity=".2" stroke-width="16" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="#101725" opacity=".08"/>
</svg>
