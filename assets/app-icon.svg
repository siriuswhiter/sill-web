<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sill app icon</title>
  <desc id="desc">A glossy cyan open pocket holding two soft cards on a transparent background.</desc>
  <defs>
    <linearGradient id="cardBack" x1="512" y1="270" x2="512" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CE6A3"/>
      <stop offset="1" stop-color="#39D79A"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="512" y1="360" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7F6DD"/>
      <stop offset="1" stop-color="#AEEFCF"/>
    </linearGradient>
    <linearGradient id="pocket" x1="512" y1="410" x2="512" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D8F0"/>
      <stop offset="1" stop-color="#0FC7E6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="512" y1="410" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F9FC0" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Cards peeking out of the pocket -->
  <rect x="330" y="286" width="356" height="300" rx="34" fill="url(#cardBack)" transform="rotate(-3 508 436)"/>
  <rect x="344" y="376" width="336" height="220" rx="30" fill="url(#cardFront)"/>

  <!-- Cyan open pocket / front panel -->
  <path
    fill="url(#pocket)"
    filter="url(#shadow)"
    d="
      M300 410
      H724
      C741.673 410 756 424.327 756 442
      V706
      C756 743.555 725.555 774 688 774
      H336
      C298.445 774 268 743.555 268 706
      V442
      C268 424.327 282.327 410 300 410
      Z
    "/>
  <!-- Silky highlight along the top rim -->
  <path
    fill="url(#gloss)"
    d="
      M300 410
      H724
      C741.673 410 756 424.327 756 442
      V520
      H268
      V442
      C268 424.327 282.327 410 300 410
      Z
    "/>
</svg>
