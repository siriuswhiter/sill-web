<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sill app icon</title>
  <desc id="desc">A centered coral pocket with a silky gloss on a bright blush background.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="96" x2="904" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5EC"/>
      <stop offset="0.55" stop-color="#FFE3D6"/>
      <stop offset="1" stop-color="#FFD2CD"/>
    </linearGradient>
    <radialGradient id="sheen" cx="320" cy="300" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerSheen" cx="780" cy="800" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB0AA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB0AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pocket" x1="350" y1="268" x2="680" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9C6E"/>
      <stop offset="0.5" stop-color="#FF6E7A"/>
      <stop offset="1" stop-color="#F65484"/>
    </linearGradient>
    <linearGradient id="gloss" x1="512" y1="268" x2="512" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#D65C60" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#lowerSheen)"/>

  <!--
    Every point in the mark is mirrored around x=512. The opening is part of
    the same silhouette, so the icon stays balanced at small sizes. A glossy
    top highlight gives the pocket a silky, light finish.
  -->
  <path
    fill="url(#pocket)"
    fill-rule="evenodd"
    filter="url(#shadow)"
    d="
      M300 268
      H724
      C741.673 268 756 282.327 756 300
      V556
      C756 716.163 646.834 824 512 824
      C377.166 824 268 716.163 268 556
      V300
      C268 282.327 282.327 268 300 268
      Z

      M360 384
      H664
      V552
      C664 659.897 599.046 732 512 732
      C424.954 732 360 659.897 360 552
      Z
    "/>
  <path
    fill="url(#gloss)"
    fill-rule="evenodd"
    d="
      M300 268
      H724
      C741.673 268 756 282.327 756 300
      V556
      C756 716.163 646.834 824 512 824
      C377.166 824 268 716.163 268 556
      V300
      C268 282.327 282.327 268 300 268
      Z

      M360 384
      H664
      V552
      C664 659.897 599.046 732 512 732
      C424.954 732 360 659.897 360 552
      Z
    "/>
</svg>
